spring.application.name=QueueCare

# Kredensial database lewat environment variable, bukan ditulis di sini.
# Contoh: DB_USERNAME=root DB_PASSWORD= mvn spring-boot:run
spring.datasource.url=jdbc:mysql://localhost:3306/queuecare?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate membuat/menyesuaikan tabel dari entity (Fase 1: tabel users).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
