<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Profil')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <div class="dash">
      <nav class="sidebar" aria-label="Menu">
        <p class="sidebar__judul">Akun kamu</p>
        <ul class="sidebar__menu">
          <li><a th:href="@{/profile}" aria-current="page">Profil</a></li>
        </ul>
      </nav>

      <div class="dash__isi">
        <h1>Profil</h1>
        <p class="teks-redup">Peran kamu <span th:text="${peran}">CUSTOMER</span>.</p>
        <p th:if="${sukses}" class="lencana lencana--completed" role="alert" th:text="${sukses}"></p>

        <div class="kartu mt-4" style="max-width: 560px;">
          <div class="kartu__badan">
            <h2 class="kartu__judul">Nama dan email</h2>
            <form th:action="@{/profile}" method="post" th:object="${form}" class="mt-3">
              <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'field--galat'">
                <label class="field__label" for="name">Nama</label>
                <input class="field__input" id="name" name="name" th:value="*{name}">
                <p class="field__bantuan" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
              </div>
              <div class="field" th:classappend="${#fields.hasErrors('email')} ? 'field--galat'">
                <label class="field__label" for="email">Email</label>
                <input class="field__input" id="email" name="email" type="email" th:value="*{email}">
                <p class="field__bantuan" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
              </div>
              <button class="tombol" type="submit">Simpan profil</button>
            </form>
          </div>
        </div>

        <div class="kartu mt-4" style="max-width: 560px;">
          <div class="kartu__badan">
            <h2 class="kartu__judul">Ganti password</h2>
            <form th:action="@{/profile/password}" method="post" th:object="${passwordForm}" class="mt-3">
              <div class="field" th:classappend="${#fields.hasErrors('passwordLama')} ? 'field--galat'">
                <label class="field__label" for="passwordLama">Password lama</label>
                <input class="field__input" id="passwordLama" name="passwordLama" type="password" autocomplete="current-password">
                <p class="field__bantuan" th:if="${#fields.hasErrors('passwordLama')}" th:errors="*{passwordLama}"></p>
              </div>
              <div class="field" th:classappend="${#fields.hasErrors('passwordBaru')} ? 'field--galat'">
                <label class="field__label" for="passwordBaru">Password baru</label>
                <input class="field__input" id="passwordBaru" name="passwordBaru" type="password" autocomplete="new-password">
                <p class="field__bantuan" th:if="${#fields.hasErrors('passwordBaru')}" th:errors="*{passwordBaru}">Minimal 8 karakter.</p>
              </div>
              <div class="field" th:classappend="${#fields.hasErrors('konfirmasi')} ? 'field--galat'">
                <label class="field__label" for="konfirmasi">Ulangi password baru</label>
                <input class="field__input" id="konfirmasi" name="konfirmasi" type="password" autocomplete="new-password">
                <p class="field__bantuan" th:if="${#fields.hasErrors('konfirmasi')}" th:errors="*{konfirmasi}"></p>
              </div>
              <button class="tombol" type="submit">Ganti password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
