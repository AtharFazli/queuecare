<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${status == 404} ? 'Tidak ditemukan' : 'Kesalahan')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah">
    <div class="row justify-content-center my-5">
      <div class="col-md-6">
        <div class="kartu">
          <div class="kartu__badan">
            <h1 class="kartu__judul" th:text="${status == 404} ? 'Halaman tidak ditemukan' : 'Terjadi kesalahan'">Halaman tidak ditemukan</h1>
            <p th:text="${status == 404} ? 'Bisnis yang kamu cari tidak ada atau sedang tidak aktif.' : 'Coba lagi beberapa saat lagi.'">Bisnis tidak ditemukan.</p>
            <a class="tombol" th:href="@{/businesses}">Lihat katalog</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
