<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Area Customer')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <div class="dash">
      <nav class="sidebar" aria-label="Menu kamu">
        <p class="sidebar__judul">Menu kamu</p>
        <ul class="sidebar__menu">
          <li><a th:href="@{/customer}" aria-current="page">Dashboard</a></li>
          <li><a th:href="@{/businesses}">Katalog</a></li>
          <li><a th:href="@{/reservations}">Riwayat</a></li>
        </ul>
      </nav>
      <div class="dash__isi">
        <h1>Halo, <span th:text="${nama}">Customer</span></h1>
        <div class="kosong">
          <h2 class="kosong__judul">Mulai dari sini</h2>
          <p class="kosong__teks">Cari bisnis jasa, buat reservasi, lalu pantau giliran kamu dari riwayat.</p>
          <div class="d-flex flex-wrap justify-content-center gap-3">
            <a class="tombol" th:href="@{/businesses}">Cari bisnis</a>
            <a class="tombol tombol--sekunder" th:href="@{/reservations}">Riwayat reservasi</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
