<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Area Customer')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <div class="dash">
      <nav class="sidebar" aria-label="Menu kamu">
        <p class="sidebar__judul">Menu kamu</p>
        <ul class="sidebar__menu">
          <li><a th:href="@{/customer}" aria-current="page">Dashboard</a></li>
          <li><a th:href="@{/businesses}">Katalog</a></li>
          <li><a th:href="@{/reservations}">Riwayat</a></li>
        </ul>
      </nav>
      <div class="dash__isi">
        <h1>Halo, <span th:text="${nama}">Customer</span></h1>
        <p class="teks-redup">Peran kamu Customer.</p>
        <div class="statistik-grid">
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Reservasi</span></div>
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Antrean aktif</span></div>
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Riwayat</span></div>
        </div>
        <div class="kosong">
          <h2 class="kosong__judul">Belum ada data</h2>
          <p class="kosong__teks">Katalog bisnis dan reservasi menyusul di fase berikutnya.</p>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
