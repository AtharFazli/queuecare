<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(judul)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${judul} + ' · QueueCare'">QueueCare</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/tokens.css}" rel="stylesheet">
  <link th:href="@{/css/components.css}" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
</head>
<body>
  <nav th:fragment="navbar" class="navbar">
    <div class="navbar__isi wadah">
      <a class="navbar__merek" th:href="@{/}">QueueCare</a>
      <button class="navbar__tombol-menu tombol tombol--kecil tombol--sekunder" type="button" aria-expanded="false" aria-controls="menu-utama">Menu</button>
      <div class="navbar__menu" id="menu-utama">
        <a th:href="@{/}" th:attr="aria-current=${active == 'beranda' ? 'page' : null}">Beranda</a>
        <th:block sec:authorize="!isAuthenticated()">
          <a th:href="@{/login}">Masuk</a>
          <a class="tombol tombol--kecil" th:href="@{/register}">Daftar</a>
        </th:block>
        <th:block sec:authorize="isAuthenticated()">
          <a th:href="@{/profile}">Profil</a>
          <span class="teks-redup navbar__pengguna">
            <span class="navbar__email" sec:authentication="name">nama@example.com</span>
            <span class="navbar__nama" th:text="${nama}">Nama pengguna</span>
          </span>
          <form th:action="@{/logout}" method="post">
            <button class="tombol tombol--kecil tombol--sekunder" type="submit">Keluar</button>
          </form>
        </th:block>
      </div>
    </div>
  </nav>

  <footer th:fragment="footer" class="footer">
    <div class="wadah">
      <p>QueueCare: reservasi dan antrean untuk bisnis jasa.</p>
      <p class="teks-redup">© 2026 QueueCare. Dibuat untuk tugas PBO.</p>
    </div>
    <!-- layout.html dipakai lewat fragment, jadi script harus di dalam fragment agar ikut ter-render -->
    <script th:src="@{/js/navbar.js}" defer></script>
  </footer>
</body>
</html>
