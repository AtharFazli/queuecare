<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Bisnis')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <h1>Bisnis kamu</h1>
    <p th:if="${sukses}" class="lencana lencana--completed" role="alert" th:text="${sukses}"></p>
    <p th:if="${error}" class="lencana lencana--no-show" role="alert" th:text="${error}"></p>

    <div th:if="${bisnis == null}" class="kosong">
      <h2 class="kosong__judul">Belum ada bisnis</h2>
      <p class="kosong__teks">Buat bisnis terlebih dahulu sebelum mengisi layanan dan jadwal.</p>
      <a class="tombol" th:href="@{/owner/business/baru}">Buat bisnis</a>
    </div>

    <div th:if="${bisnis != null}" class="kartu">
      <div class="kartu__badan">
        <h2 class="kartu__judul" th:text="${bisnis.name}">Nama bisnis</h2>
        <p class="kartu__meta">Kategori: <span th:text="${bisnis.category.name}">Barbershop</span></p>
        <p>Status:
          <span class="lencana" th:classappend="${bisnis.status.name() == 'ACTIVE'} ? 'lencana--completed' : (${bisnis.status.name() == 'INACTIVE'} ? 'lencana--cancelled' : 'lencana--waiting')" th:text="${bisnis.status.name() == 'ACTIVE' ? 'Aktif' : bisnis.status.name() == 'INACTIVE' ? 'Nonaktif' : 'Menunggu verifikasi'}">Menunggu verifikasi</span>
        </p>
        <p class="teks-redup" th:text="${bisnis.description}">Deskripsi bisnis</p>
        <a class="tombol" th:href="@{/owner/business/{id}(id=${bisnis.id})}">Ubah bisnis</a>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
