<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard Admin')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <div class="dash">
      <nav class="sidebar" aria-label="Menu Admin">
        <p class="sidebar__judul">Menu Admin</p>
        <ul class="sidebar__menu">
          <li><a th:href="@{/admin}" aria-current="page">Dashboard</a></li>
          <li><a th:href="@{/admin/businesses}">Bisnis</a></li>
          <li><a th:href="@{/admin/categories}">Kategori</a></li>
        </ul>
      </nav>
      <div class="dash__isi">
        <h1>Halo, <span th:text="${nama}">Admin</span></h1>
        <p class="teks-redup">Peran kamu Admin.</p>
        <div class="statistik-grid">
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Pengguna</span></div>
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Bisnis</span></div>
          <div class="statistik"><span class="statistik__angka">0</span><span class="statistik__label">Reservasi</span></div>
        </div>
        <div class="kosong">
          <h2 class="kosong__judul">Belum ada data</h2>
          <p class="kosong__teks">Statistik di atas terisi otomatis setelah ada aktivitas di platform.</p>
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
