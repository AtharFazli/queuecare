<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Reservasi Admin')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="dash-luar">
    <div class="dash">
      <nav th:replace="~{fragments/layout :: sidebar('admin','reservasi')}"></nav>
      <div class="dash__isi">
    <h1>Reservasi</h1>

    <form th:action="@{/admin/reservations}" method="get" class="mt-3">
      <div class="field">
        <label class="field__label" for="dari">Dari tanggal</label>
        <input class="field__input" id="dari" name="dari" type="date" th:value="${dari}">
      </div>
      <div class="field">
        <label class="field__label" for="sampai">Sampai tanggal</label>
        <input class="field__input" id="sampai" name="sampai" type="date" th:value="${sampai}">
      </div>
      <div class="field">
        <label class="field__label" for="bisnis">Bisnis</label>
        <select class="field__input" id="bisnis" name="bisnis">
          <option value="">Semua bisnis</option>
          <option th:each="b : ${bisnis}" th:value="${b.id}" th:text="${b.name}" th:selected="${b.id == bisnisId}">Barbershop Senja</option>
        </select>
      </div>
      <div class="field">
        <label class="field__label" for="status">Status</label>
        <select class="field__input" id="status" name="status">
          <option value="">Semua status</option>
          <option th:each="s : ${status}" th:value="${s}" th:text="${s == 'PENDING' ? 'Menunggu' : s == 'CONFIRMED' ? 'Dikonfirmasi' : s == 'CANCELLED' ? 'Dibatalkan' : 'Selesai'}" th:selected="${s == statusParam}">Dikonfirmasi</option>
        </select>
      </div>
      <button class="tombol" type="submit">Terapkan</button>
    </form>

    <div th:if="${baris.totalElements == 0}" class="kosong mt-4">
      <h2 class="kosong__judul">Belum ada data</h2>
      <p class="kosong__teks">Tidak ada reservasi yang cocok dengan filter.</p>
    </div>

    <div class="tabel-bungkus mt-4" th:unless="${baris.totalElements == 0}">
      <table class="tabel">
        <thead>
          <tr><th>Kode</th><th>Pelanggan</th><th>Bisnis</th><th>Layanan</th><th>Tanggal</th><th>Jam</th><th>Status reservasi</th><th>Status antrean</th></tr>
        </thead>
        <tbody>
          <tr th:each="b : ${baris}">
            <td th:text="${b.kode}">QC-20261116-0001</td>
            <td th:text="${b.customer}">Dummy Satu</td>
            <td th:text="${b.bisnis}">Barbershop Senja</td>
            <td th:text="${b.layanan}">Cukur rambut</td>
            <td th:text="${#temporals.format(b.tanggal, 'dd/MM/yyyy')}">16/11/2026</td>
            <td th:text="${b.jam}">10:00</td>
            <td><span class="lencana" th:classappend="${'lencana--' + #strings.toLowerCase(#strings.replace(b.statusReservasi, '_', '-'))}" th:text="${b.statusReservasi == 'PENDING' ? 'Menunggu' : b.statusReservasi == 'CONFIRMED' ? 'Dikonfirmasi' : b.statusReservasi == 'CANCELLED' ? 'Dibatalkan' : 'Selesai'}">Dikonfirmasi</span></td>
            <td><span class="lencana" th:classappend="${'lencana--' + #strings.toLowerCase(#strings.replace(b.statusAntrean, '_', '-'))}" th:text="${b.statusAntrean == 'WAITING' ? 'Menunggu' : b.statusAntrean == 'CALLED' ? 'Dipanggil' : b.statusAntrean == 'IN_SERVICE' ? 'Dilayani' : b.statusAntrean == 'COMPLETED' ? 'Selesai' : b.statusAntrean == 'NO_SHOW' ? 'Tidak hadir' : 'Dibatalkan'}">Menunggu</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <p class="teks-redup mt-3" th:if="${baris.totalElements > 0}">
      Halaman <span th:text="${baris.number + 1}">1</span> dari <span th:text="${baris.totalPages}">1</span>
      · <span th:text="${baris.totalElements}">9</span> reservasi
    </p>
    <div class="tabel__aksi mt-3" th:if="${baris.totalPages > 1}">
      <a class="tombol tombol--kecil" th:if="${!baris.first}"
         th:href="@{/admin/reservations(hal=${baris.number}, dari=${dari}, sampai=${sampai}, bisnis=${bisnisId}, status=${statusParam})}">Sebelumnya</a>
      <a class="tombol tombol--kecil" th:if="${!baris.last}"
         th:href="@{/admin/reservations(hal=${baris.number + 2}, dari=${dari}, sampai=${sampai}, bisnis=${bisnisId}, status=${statusParam})}">Berikutnya</a>
    </div>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
