<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Bisnis')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <div class="dash">
      <nav th:replace="~{fragments/layout :: sidebar('admin','bisnis')}"></nav>
      <div class="dash__isi">
    <h1>Bisnis</h1>
    <p th:if="${sukses}" class="lencana lencana--completed" role="alert" th:text="${sukses}"></p>
    <p th:if="${error}" class="lencana lencana--no-show" role="alert" th:text="${error}"></p>

    <div th:if="${#lists.isEmpty(bisnis)}" class="kosong">
      <h2 class="kosong__judul">Belum ada bisnis</h2>
      <p class="kosong__teks">Belum ada Owner yang membuat bisnis.</p>
    </div>

    <div class="tabel-bungkus" th:unless="${#lists.isEmpty(bisnis)}">
      <table class="tabel">
        <thead>
          <tr><th>Nama</th><th>Pemilik</th><th>Kategori</th><th>Status</th><th>Ubah status</th></tr>
        </thead>
        <tbody>
          <tr th:each="b : ${bisnis}">
            <td th:text="${b.name}">Bisnis contoh</td>
            <td th:text="${b.owner.name}">Owner Demo</td>
            <td th:text="${b.category.name}">Barbershop</td>
            <td>
              <span class="lencana" th:classappend="${b.status.name() == 'ACTIVE'} ? 'lencana--completed' : (${b.status.name() == 'INACTIVE'} ? 'lencana--cancelled' : 'lencana--waiting')" th:text="${b.status.name() == 'ACTIVE' ? 'Aktif' : b.status.name() == 'INACTIVE' ? 'Nonaktif' : 'Menunggu verifikasi'}">Menunggu verifikasi</span>
            </td>
            <td>
              <button class="tombol tombol--kecil" type="button"
                      th:onclick="|document.getElementById('status-bisnis-' + ${b.id}).showModal()|">Ubah status</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <dialog class="modal" th:each="b : ${bisnis}" th:id="|status-bisnis-${b.id}|">
      <div class="modal__kepala"><h3>Ubah status <span th:text="${b.name}">Bisnis</span>?</h3></div>
      <form th:action="@{/admin/businesses/{id}/status(id=${b.id})}" method="post">
        <div class="modal__badan">
          <p>Bisnis nonaktif hilang dari katalog pelanggan. Bisnis pending baru tampil setelah diaktifkan.</p>
          <div class="field">
            <label class="field__label" th:for="|pilih-status-${b.id}|">Status baru</label>
            <select class="field__input" th:id="|pilih-status-${b.id}|" name="status">
              <option th:each="s : ${T(com.queuecare.enums.BusinessStatus).values()}" th:value="${s}" th:text="${s.name() == 'ACTIVE' ? 'Aktif' : s.name() == 'INACTIVE' ? 'Nonaktif' : 'Menunggu verifikasi'}" th:selected="${s == b.status}">Aktif</option>
            </select>
          </div>
        </div>
        <div class="modal__kaki">
          <button class="tombol tombol--sekunder" type="button" onclick="this.closest('dialog').close()">Kembali</button>
          <button class="tombol" type="submit">Simpan status</button>
        </div>
      </form>
    </dialog>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
