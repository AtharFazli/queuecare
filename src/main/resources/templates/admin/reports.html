<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Laporan Admin')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <h1>Laporan Admin</h1>
    <p class="teks-redup">
      Rentang <span th:text="${laporan.dari}">2026-10-17</span> sampai <span th:text="${laporan.sampai}">2026-11-16</span>
    </p>
    <p th:if="${error}" class="lencana lencana--no-show" role="alert" th:text="${error}"></p>

    <form th:action="@{/admin/reports}" method="get" class="mt-3">
      <div class="field">
        <label class="field__label" for="dari">Dari tanggal</label>
        <input class="field__input" id="dari" name="dari" type="date" th:value="${laporan.dari}">
      </div>
      <div class="field">
        <label class="field__label" for="sampai">Sampai tanggal</label>
        <input class="field__input" id="sampai" name="sampai" type="date" th:value="${laporan.sampai}">
      </div>
      <button class="tombol" type="submit">Terapkan</button>
    </form>

    <div class="statistik-grid mt-4">
      <div class="statistik"><span class="statistik__angka" th:text="${laporan.totalBisnis}">0</span><span class="statistik__label">Bisnis</span></div>
      <div class="statistik"><span class="statistik__angka" th:text="${laporan.totalPengguna}">0</span><span class="statistik__label">Pengguna</span></div>
      <div class="statistik"><span class="statistik__angka" th:text="${laporan.totalReservasi}">0</span><span class="statistik__label">Reservasi pada rentang</span></div>
    </div>

    <h2 class="mt-4">Reservasi per hari</h2>
    <div th:if="${#lists.isEmpty(laporan.reservasiPerHari)}" class="kosong mt-3">
      <h2 class="kosong__judul">Belum ada data</h2>
      <p class="kosong__teks">Tidak ada reservasi pada rentang tanggal ini.</p>
    </div>
    <div class="tabel-bungkus mt-3" th:unless="${#lists.isEmpty(laporan.reservasiPerHari)}">
      <table class="tabel">
        <thead><tr><th>Tanggal</th><th>Reservasi</th></tr></thead>
        <tbody>
          <tr th:each="h : ${laporan.reservasiPerHari}">
            <td th:text="${h.tanggal}">2026-11-16</td>
            <td class="tabel__angka" th:text="${h.jumlah}">9</td>
          </tr>
        </tbody>
      </table>
    </div>

    <h2 class="mt-4">Ringkasan status antrean</h2>
    <div th:if="${#lists.isEmpty(laporan.statusAntrean)}" class="kosong mt-3">
      <h2 class="kosong__judul">Belum ada data</h2>
      <p class="kosong__teks">Belum ada antrean.</p>
    </div>
    <div class="tabel-bungkus mt-3" th:unless="${#lists.isEmpty(laporan.statusAntrean)}">
      <table class="tabel">
        <thead><tr><th>Status</th><th>Jumlah</th></tr></thead>
        <tbody>
          <tr th:each="s : ${laporan.statusAntrean}">
            <td><span class="lencana" th:classappend="${s.status.kelas}" th:text="${s.status.name() == 'WAITING' ? 'Menunggu' : s.status.name() == 'CALLED' ? 'Dipanggil' : s.status.name() == 'IN_SERVICE' ? 'Dilayani' : s.status.name() == 'COMPLETED' ? 'Selesai' : s.status.name() == 'NO_SHOW' ? 'Tidak hadir' : 'Dibatalkan'}">Menunggu</span></td>
            <td class="tabel__angka" th:text="${s.jumlah}">3</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
