<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Detail reservasi')}"></head>
<body>
  <nav th:replace="~{fragments/layout :: navbar}"></nav>

  <main class="wadah my-5">
    <p><a th:href="@{/reservations}">Kembali ke riwayat</a></p>
    <h1>Detail reservasi</h1>
    <p th:if="${sukses}" class="lencana lencana--completed" role="alert" th:text="${sukses}"></p>
    <p th:if="${error}" class="lencana lencana--no-show" role="alert" th:text="${error}"></p>

    <div class="tiket">
      <div class="tiket__info">
        <div class="tiket__kode" th:text="${reservasi.reservationCode}">QC-20261116-0001</div>
        <div class="tiket__nama" th:text="${reservasi.business.name}">Barbershop Senja</div>
        <div>
          <span th:text="${reservasi.service.name}">Cukur rambut</span> ·
          <span th:text="${#temporals.format(reservasi.reservationDate, 'dd/MM/yyyy')}">16/11/2026</span>,
          <span th:text="${reservasi.reservationTime}">09:00</span>
        </div>
        <span class="lencana" th:classappend="${reservasi.status.kelas}" th:text="${reservasi.status}">CONFIRMED</span>
      </div>
      <div class="tiket__nomor">
        <span>Antrean</span>
        <strong th:text="${#numbers.formatInteger(antrean.queueNumber, 2, 'POINT')}">01</strong>
      </div>
    </div>

    <h2 class="mt-4">Status antrean</h2>
    <p>
      Nomor antrean <b th:text="${antrean.queueNumber}">1</b>
      <span class="lencana" th:classappend="${antrean.status.kelas}" th:text="${antrean.status}">WAITING</span>
    </p>

    <p class="mt-3" th:if="${reservasi.notes != null and !reservasi.notes.isEmpty()}">
      Catatan: <span th:text="${reservasi.notes}">Catatan pelanggan</span>
    </p>

    <div class="mt-4" th:if="${antrean.status.name() == 'WAITING'}">
      <button class="tombol tombol--bahaya" type="button" onclick="document.getElementById('batal').showModal()">Batalkan reservasi</button>
    </div>

    <a class="tombol mt-4" th:if="${antrean != null and bisaPantau}" th:href="@{/queue/{id}(id=${antrean.id})}">Pantau antrean</a>

    <dialog class="modal" id="batal">
      <div class="modal__kepala"><h3>Batalkan reservasi?</h3></div>
      <div class="modal__badan"><p>Tindakan ini tidak bisa diulang.</p></div>
      <div class="modal__kaki">
        <button class="tombol tombol--sekunder" type="button" onclick="this.closest('dialog').close()">Kembali</button>
        <form th:action="@{/reservations/{id}/batal(id=${reservasi.id})}" method="post">
          <button class="tombol tombol--bahaya" type="submit">Batalkan reservasi</button>
        </form>
      </div>
    </dialog>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
