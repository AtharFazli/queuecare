spring.application.name=QueueCare Test

# Database uji terpisah dari database aplikasi.
spring.datasource.url=jdbc:mysql://localhost:3306/queuecare_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Jakarta&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Data dummy tidak dijalankan saat pengujian.
app.seed-dummy=false
